# Spec v4.3.3 §29.1 quality gate on Linux and Windows. Actions are pinned by
# full commit SHA (§32): a moving tag can be repointed, as in CVE-2025-30066.
# The Windows job is the only way to verify VT100 detection and prompts,
# which have never been executed on Windows (see SECURITY.md, SPEC-001 §15).
name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, tokenizer, pcntl, posix
          coverage: pcov

      - name: Install shells for completion tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - run: composer install --no-interaction --no-progress

      - run: composer cs-check
      - run: composer phpstan
      - run: composer psalm
      - run: composer complexity
      - run: composer test
      - run: composer security

      - name: Mutation testing (MSI >= 80%)
        if: runner.os == 'Linux'
        run: composer infection
